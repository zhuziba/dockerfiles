name: 构建hubdocker镜像
on:
  watch:
    types: [started]
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: oxidns
            context: ./oxidns
          - image: openlist
            context: ./openlist
          - image: adguardhome
            context: ./AdGuardHome
          - image: test
            context: ./test
          - image: smartdns
            context: ./smartdns
          - image: mihomo
            context: ./mihomo
          - image: v2raya
            context: ./v2raya
          - image: blocky
            context: ./blocky
          - image: mosproxy
            context: ./mosproxy
          - image: technitium
            context: ./technitium
          - image: elecv2p
            context: ./v2p
          - image: xray
            context: ./xray
          - image: singbox
            context: ./singbox
          - image: mosdnsx
            context: ./mosdnsx

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.image }}
        run: |
          docker buildx build \
            --platform linux/arm64,linux/amd64 \
            --tag ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }} \
            --push \
            ${{ matrix.context }}

